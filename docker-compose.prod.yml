# Coolify resource type "Docker Compose", build pack dockercompose.
#
# No `networks:` block on purpose: Coolify creates one network per resource and
# attaches Traefik to it. Declaring an own network leaves the proxy outside it,
# which surfaces as intermittent 504s rather than as a configuration error.
#
# The application holds no game state at all: a round runs entirely in the
# browser that opened it, so replicas are free and every tab is its own world.
# This serves files and nothing else.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
