# Coolify resource type "Docker Compose", build pack dockercompose.
#
# No `networks:` block on purpose: Coolify creates one network per resource and
# attaches Traefik to it. Declaring an own network leaves the proxy outside it,
# which surfaces as intermittent 504s rather than as a configuration error.
#
# This stack must run with exactly ONE replica. The event bus lives in the
# application process, so a second instance would hold a second, separate world:
# each browser would only see the events raised by the instance it happens to be
# connected to, and nothing in the application reports the split.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
